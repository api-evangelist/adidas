serviceCategory: Retail / Sportswear
billingModel:
  pricingCategory: Commission
  billingFrequency: Per-Invoice
  billingCurrency: EUR
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Adidas Affiliate / Partner Surface
  ServiceCategory: Retail / Sportswear
  ProviderName: Adidas
  PublisherName: adidas AG
  InvoiceIssuerName: Affiliate Network (Awin / Rakuten) or Adidas Wholesale
  BillingCurrency: EUR
meters:
  - name: affiliate_sale
    description: Commission earned by an affiliate on a tracked Adidas sale; mediated by Awin / Rakuten.
    unit: sale
    aggregation: sum
    dimensions:
      - affiliate
      - region
principles:
  - name: Visibility
    description: Track Adidas-related affiliate spend through the affiliate-network reporting surface.
  - name: Allocation
    description: Allocate affiliate commission to the marketing channel that drove the conversion.
  - name: Optimization
    description: Optimize affiliate commission via the network's own attribution and incentive controls; Adidas does not expose a separate metering API.
  - name: Accountability
    description: Marketing / partnerships own the affiliate relationship; finance reconciles the network invoice.
